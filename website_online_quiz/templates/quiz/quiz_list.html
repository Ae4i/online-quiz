{% extends 'base.html' %}

{% block content %}
    <h2 class="mb-4">Список квізів</h2>
    <div class="list-group">
        {% for quiz in quizzes %}
            <a href="{% url 'online_quiz:pass_quiz' quiz.pk %}" class="list-group-item list-group-item-action">
                <h5 class="mb-1">{{ quiz.title }}</h5>
                <small class="text-muted">Автор: {{ quiz.author.username }}</small>
            </a>
        {% empty %}
            <div class="alert alert-info">Квізів ще немає.</div>
        {% endfor %}
    </div>
{% endblock %}
