{% extends 'base.html' %}

{% block content %}
    <h2 class="mb-4">Додати питання</h2>
    
    <form method="post" class="mt-3">
        {% csrf_token %}
        
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        
        <button type="submit" class="btn btn-success mt-2">Зберегти питання</button>
        <a href="{% url 'online_quiz:quiz_list' %}" class="btn btn-secondary mt-2 ms-2">Скасувати</a>
    </form>
{% endblock %}
