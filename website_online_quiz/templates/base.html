<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Квізи</title>
    <!-- Підключення Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Навігаційна панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'online_quiz:quiz_list' %}">QuizApp</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'online_quiz:quiz_list' %}">Всі квізи</a>

                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'online_quiz:add_quiz' %}">Створити квіз</a>
                    <a class="nav-link" href="{% url 'online_quiz:add_question' %}">Додати питання</a>
                    <span class="nav-link text-warning">| Привіт, {{ user.username }}!</span>
                    <a class="nav-link text-info" href="{% url 'online_quiz:profile' %}">Мій профіль</a>
                    <a class="nav-link" href="{% url 'online_quiz:add_quiz' %}">Створити квіз</a>

                    <!-- Оскільки LogoutView в Django 5 працює через POST, краще робити це кнопкою -->
                    <form method="post" action="{% url 'online_quiz:logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link">Вийти</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'online_quiz:login' %}">Увійти</a>
                    <a class="nav-link" href="{% url 'online_quiz:register' %}">Реєстрація</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Основний контент сторінок буде вставлятися сюди -->
    <div class="container">
        <div class="card shadow-sm p-4">
            {% block content %}
            {% endblock %}
        </div>
    </div>

</body>
</html>
